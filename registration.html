<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <link rel="stylesheet" href="registration.css">
</head>
<body>
  <body>
  <header class="top-nav">
    <nav>
      <a href=.html">Registration Form</a>
      <a href="data.html" class="active">Data Table</a>
    </nav>
  </header>
</body>
  <div class="form-container">
    <h2>Register</h2>
    <form id="registrationForm" novalidate>
      
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe">
        <span class="error-message" id="nameError"></span>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="example@domain.com">
        <span class="error-message" id="emailError"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 8 characters">
        <span class="error-message" id="passwordError"></span>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password">
        <span class="error-message" id="confirmPasswordError"></span>
      </div>

      
      <div class="form-group">
        <label for="age">Age</label>
        <input type="number" id="age" name="age" placeholder="Must be 18 or older">
        <span class="error-message" id="ageError"></span>
      </div>

      <button type="submit" id="submitBtn">Register</button>
    </form>
  </div>

  <script src="regristation.js"></script>
</body>
</html>
